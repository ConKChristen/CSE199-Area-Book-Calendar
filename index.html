  <div class = 'calendarjs'>

    <p>Log In for Calendar</p>
    <!--Add buttons to initiate auth sequence and sign out-->
    <button id="authorize_button" onclick="handleAuthClick()">Sign In</button>
    <button id="signout_button" onclick="handleSignoutClick()">Sign Out</button>
    
    <!-- ADD WEEK NAVIGATION BUTTONS -->
    <div class="week-navigation" style="display: none;" id="weekNav">
    <button id="prevWeek">← Previous Week</button>
    <button id="todayButton">Today</button>
    <span id="weekDisplay"></span>
    <button id="nextWeek">Next Week →</button>
</div>
    
    <div id="content"></div>
    
    <script type="text/javascript">
      /* exported gapiLoaded */
      /* exported gisLoaded */
      /* exported handleAuthClick */
      /* exported handleSignoutClick */

      // TODO(developer): Set to client ID and API key from the Developer Console
      const CLIENT_ID = '882122220134-4udf0avmnrrm0m313i6on3njenq9387j.apps.googleusercontent.com';
      const API_KEY = 'AIzaSyBC7DukCpSrOjrguRrca3Opvc7MTKCP-lc';

      // Discovery doc URL for APIs used by the quickstart
      const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';

      // Authorization scopes required by the API; multiple scopes can be
      // included, separated by spaces.
      const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';

      let tokenClient;
      let gapiInited = false;
      let gisInited = false;
      let currentWeekOffset = 0; // ADD THIS LINE

      document.getElementById('authorize_button').style.visibility = 'hidden';
      document.getElementById('signout_button').style.visibility = 'hidden';

      /**
       * Callback after api.js is loaded.
       */
      function gapiLoaded() {
        gapi.load('client', initializeGapiClient);
      }

      /**
       * Callback after the API client is loaded. Loads the
       * discovery doc to initialize the API.
       */
      async function initializeGapiClient() {
        await gapi.client.init({
          apiKey: API_KEY,
          discoveryDocs: [DISCOVERY_DOC],
        });
        gapiInited = true;
        maybeEnableButtons();
      }

      /**
       * Callback after Google Identity Services are loaded.
       */
      function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: '', // defined later
        });
        gisInited = true;
        maybeEnableButtons();
      }

      /**
       * Enables user interaction after all libraries are loaded.
       */
      function maybeEnableButtons() {
        if (gapiInited && gisInited) {
          document.getElementById('authorize_button').style.visibility = 'visible';
        }
      }

      /**
       *  Sign in the user upon button click.
       */
      function handleAuthClick() {
        tokenClient.callback = async (resp) => {
          if (resp.error !== undefined) {
            throw (resp);
          }
          document.getElementById('signout_button').style.visibility = 'visible';
          document.getElementById('authorize_button').innerText = 'Refresh';
          await listUpcomingEvents();
        };

        if (gapi.client.getToken() === null) {
          tokenClient.requestAccessToken({prompt: 'consent'});
        } else {
          tokenClient.requestAccessToken({prompt: ''});
        }
      }

      /**
       *  Sign out the user upon button click.
       */
      function handleSignoutClick() {
        const token = gapi.client.getToken();
        if (token !== null) {
          google.accounts.oauth2.revoke(token.access_token);
          gapi.client.setToken('');
          document.getElementById('content').innerText = '';
          document.getElementById('authorize_button').innerText = 'Authorize';
          document.getElementById('signout_button').style.visibility = 'hidden';
        }
      }

      /**
       * Fetch calendar events for the week
       */
      async function listUpcomingEvents() {
        let response;
        try {
          // Get events for the current week
          const now = new Date();
          const startOfWeek = new Date(now);
          startOfWeek.setDate(now.getDate() - now.getDay() + (currentWeekOffset * 7)); // UPDATED
          startOfWeek.setHours(0, 0, 0, 0);
          
          const endOfWeek = new Date(startOfWeek);
          endOfWeek.setDate(startOfWeek.getDate() + 7);
          
          const request = {
            'calendarId': 'primary',
            'timeMin': startOfWeek.toISOString(),
            'timeMax': endOfWeek.toISOString(),
            'showDeleted': false,
            'singleEvents': true,
            'orderBy': 'startTime',
          };
          response = await gapi.client.calendar.events.list(request);
        } catch (err) {
          document.getElementById('content').innerText = err.message;
          return;
        }

        const events = response.result.items;
        renderWeekView(events);
      }

      function renderWeekView(events) {
        const contentDiv = document.getElementById('content');
        const now = new Date(); // FIXED: Moved before usage
        const startOfWeek = new Date(now);
        startOfWeek.setDate(now.getDate() - now.getDay() + (currentWeekOffset * 7)); // UPDATED
        startOfWeek.setHours(0, 0, 0, 0);
        
        showWeekNavigation();
        updateWeekDisplay();
        
        // Build week view HTML
        let html = '<div class="calendar-week-container">';
        
        // Header with days
        html += '<div class="week-header">';
        html += '<div class="time-column-header"></div>';
        
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        for (let i = 0; i < 7; i++) {
          const day = new Date(startOfWeek);
          day.setDate(startOfWeek.getDate() + i);
          const isToday = day.toDateString() === now.toDateString();
          html += `<div class="day-header ${isToday ? 'today' : ''}">
                    <div class="day-name">${days[i].substring(0, 3)}</div>
                    <div class="day-number">${day.getDate()}</div>
                  </div>`;
        }
        html += '</div>';
        
        // Time slots (6 AM to 10 PM)
        html += '<div class="week-grid">';
        for (let hour = 6; hour <= 22; hour++) {
          html += '<div class="time-row">';
          html += `<div class="time-label">${hour % 12 || 12}:00 ${hour < 12 ? 'AM' : 'PM'}</div>`;
          
          // Day columns
          for (let dayIndex = 0; dayIndex < 7; dayIndex++) {
            const currentDay = new Date(startOfWeek);
            currentDay.setDate(startOfWeek.getDate() + dayIndex);
            currentDay.setHours(hour, 0, 0, 0);
            
            html += `<div class="day-cell" data-day="${dayIndex}" data-hour="${hour}">`;
            
            // Add events that fall in this time slot
            events.forEach(event => {
              const eventStart = new Date(event.start.dateTime || event.start.date);
              const eventEnd = new Date(event.end.dateTime || event.end.date);
              
              if (eventStart.getDate() === currentDay.getDate() &&
                  eventStart.getMonth() === currentDay.getMonth() &&
                  eventStart.getHours() === hour) {
                
                const duration = (eventEnd - eventStart) / (1000 * 60); // minutes
                const heightPercent = (duration / 60) * 100; // percent of hour
                
                html += `<div class="event" style="height: ${heightPercent}%">
                          <div class="event-title">${event.summary}</div>
                          <div class="event-time">${eventStart.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'})}</div>
                        </div>`;
              }
            });
            
            html += '</div>';
          }
          html += '</div>';
        }
        html += '</div></div>';
        
        contentDiv.innerHTML = html;
      }

      // ADD THESE FUNCTIONS
      function showWeekNavigation() {
        document.getElementById('weekNav').style.display = 'block';
      }

      function updateWeekDisplay() {
        const now = new Date();
        const startOfWeek = new Date(now);
        startOfWeek.setDate(now.getDate() - now.getDay() + (currentWeekOffset * 7));
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(startOfWeek.getDate() + 6);
        
        const options = { month: 'short', day: 'numeric' };
        document.getElementById('weekDisplay').innerText = 
            `${startOfWeek.toLocaleDateString('en-US', options)} - ${endOfWeek.toLocaleDateString('en-US', options)}`;
      }

      // ADD EVENT LISTENERS
      document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('prevWeek')?.addEventListener('click', () => {
    currentWeekOffset--;
    listUpcomingEvents();
  });

  document.getElementById('nextWeek')?.addEventListener('click', () => {
    currentWeekOffset++;
    listUpcomingEvents();
  });

  // ADD THIS NEW EVENT LISTENER
  document.getElementById('todayButton')?.addEventListener('click', () => {
    currentWeekOffset = 0;
    listUpcomingEvents();
  });
});
    </script>
